services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: persian-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: persian_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: persian-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/persian_rag


    depends_on:
      - postgres

volumes:
  postgres_data:
